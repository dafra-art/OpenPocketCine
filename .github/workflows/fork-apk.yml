name: Fork APK (shot presets)

# Builds an installable debug APK of this fork: upstream OpenPocketCine plus the
# gimbal shot presets. OpenCine is checked out at the upstream pin, then the patches
# in patches/opencine/ are applied. The APK is signed with the committed
# fork-debug.keystore so each new build installs over the previous one.
on:
  push:
    branches: [feat/shot-presets]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    # Pinned: the Swift 6.3.3 toolchain is built for 24.04 (ubuntu-latest moved to 26 and lacks libxml2.so.2).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check out pinned OpenCine and apply the fork patches
        run: |
          set -euo pipefail
          scripts/checkout-opencine.sh
          git -C ../OpenCine -c user.name=fork -c user.email=fork@example.invalid am --3way \
            "$PWD"/patches/opencine/*.patch

      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh

      # services.gradle.org sometimes times out at the wrapper's 10 s default: wait longer and retry.
      - name: Download the Gradle distribution
        working-directory: Apps/Android
        run: |
          set -uo pipefail
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties \
            || echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle download attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Use the fork's stable debug key
        run: |
          mkdir -p ~/.android
          cp Apps/Android/fork-debug.keystore ~/.android/debug.keystore

      - name: Unit tests for shot presets
        continue-on-error: true
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew :opencine:camera-controls:testDebugUnitTest --tests '*GimbalShotPresetsTest*' :opencine:dji:testDebugUnitTest --tests '*GimbalShotPreset*' --tests '*GimbalProgramTest*'

      - name: Assemble debug APK
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenPocketCine-shots-debug-apk
          path: Apps/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
